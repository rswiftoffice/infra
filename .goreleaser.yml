builds:
  - binary: infra
    ldflags:
      - '-X "raid/infra/internal/config.GitlabHTTPSDomain={{ .Env.GITLAB_HTTPS_DOMAIN }}"'
      - '-X "raid/infra/internal/config.GitlabSSHDomain={{ .Env.GITLAB_SSH_DOMAIN }}"'
      - '-X "raid/infra/internal/config.CommonAWSAccountID={{ .Env.COMMON_AWS_ACCOUNT_ID }}"'
      - '-X "raid/infra/internal/config.OIDCSubjectPattern={{ .Env.OIDC_SUBJECT_PATTERN }}"'
      - '-X "raid/infra/cmd.version={{ .Version }}"'
      - '-X "raid/infra/cmd.commit={{ .ShortCommit }}"'
      - '-X "raid/infra/cmd.date={{ .Date }}"'
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64


universal_binaries:
  - replace: true

brews:
  -
    name: infra
    homepage: "https://github.com/rswiftoffice/infra"
    repository:
      owner: rswiftoffice
      name: homebrew-infra
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: OliverTeo288
      email: oliverteo288@gmail.com

checksum:
  name_template: 'checksums.txt'
snapshot:
  name_template: "{{ incpatch .Version }}-next"