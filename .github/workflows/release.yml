name: goreleaser

on:
  # Only run a publishing build on strict semver tag pushes
  # (MAJOR.MINOR.PATCH, optionally with a pre-release suffix).
  # PRs are validated via the main CI workflow (lint/unit/integration), so
  # we don't need to run goreleaser on every PR — which would also expose
  # build-time secrets to PRs from forks.
  #
  # Match (e.g.):     0.1.0, 5.1.2, 12.0.0, 1.2.3-rc.1
  # Reject (e.g.):    v1.2.3, 1.2, 1.2.3.4, dev, foo
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  # Allow manual runs. Set slack_test=true to skip the build and only send a
  # clearly labelled [TEST] message to the release webhook.
  workflow_dispatch:
    inputs:
      slack_test:
        description: "Only send a [TEST] Slack notification (skips the build)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  goreleaser:
    if: ${{ !inputs.slack_test }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Inject build-time secrets
        run: |
          echo "GITLAB_HTTPS_DOMAIN=${{ secrets.GITLAB_HTTPS_DOMAIN }}" >> $GITHUB_ENV
          echo "GITLAB_SSH_DOMAIN=${{ secrets.GITLAB_SSH_DOMAIN }}" >> $GITHUB_ENV
          echo "COMMON_AWS_ACCOUNT_ID=${{ secrets.COMMON_AWS_ACCOUNT_ID }}" >> $GITHUB_ENV
          echo "OIDC_SUBJECT_PATTERN=${{ secrets.OIDC_SUBJECT_PATTERN }}" >> $GITHUB_ENV
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # Pin the goreleaser CLI version. Bump deliberately; "latest" would
          # silently take any new major.
          version: "~> v2"
          args: release --clean
        env:
          # Built-in token creates the GitHub release on this repo
          # (job has contents: write). The PAT is scoped to the tap only.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}

  notify-slack:
    needs: goreleaser
    runs-on: ubuntu-latest
    # Runs after a successful release, or alone when goreleaser was skipped
    # for a slack_test dispatch. A failed release never announces.
    if: ${{ !cancelled() && (needs.goreleaser.result == 'success' || needs.goreleaser.result == 'skipped') }}
    steps:
      - name: Send Slack Notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          CI_PROJECT_NAME: ${{ github.repository }}
          CI_COMMIT_TAG: ${{ inputs.slack_test && '[TEST]' || github.ref_name }}
          CI_COMMIT_TAG_MESSAGE: ${{ inputs.slack_test && '[TEST] webhook check, ignore' || github.event.head_commit.message || format('Release {0}', github.ref_name) }}
        run: |
          # Use jq to JSON-encode the payload so untrusted commit messages
          # can't break the JSON or smuggle escape sequences into curl args.
          payload=$(jq -nc \
            --arg project "$CI_PROJECT_NAME" \
            --arg tag "$CI_COMMIT_TAG" \
            --arg message "$CI_COMMIT_TAG_MESSAGE" \
            '{CI_PROJECT_NAME: $project, CI_COMMIT_TAG: $tag, CI_COMMIT_TAG_MESSAGE: $message}')

          # Fail the job on a non-2xx response so a bad webhook can't look green.
          status=$(curl -sS -o /tmp/slack-response.txt -w '%{http_code}' \
            -X POST -H "Content-type: application/json" \
            --data-binary "$payload" "$SLACK_WEBHOOK")
          echo "Slack responded HTTP $status"
          cat /tmp/slack-response.txt; echo
          case "$status" in
            2*) ;;
            *) echo "::error::Slack webhook rejected the request (HTTP $status)"; exit 1 ;;
          esac
